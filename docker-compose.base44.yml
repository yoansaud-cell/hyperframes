services:
  studio:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - bun-cache:/root/.bun/install/cache
    ports:
      - "3000:5190"
    environment:
      # Platform-managed: lets the preview proxy reach the dev server
      - BASE44_PREVIEW_MODE=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      # Vite >= 6.1 appends this to its allowedHosts list
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile \
        && bun run --filter '@hyperframes/{parsers,lint,studio-server}' build \
        && bun run --filter @hyperframes/core build \
        && cd packages/studio \
        && exec bun --bun ./node_modules/.bin/vite --host 0.0.0.0
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r=await fetch('http://localhost:5190/');if(!r.ok)throw new Error(String(r.status))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    restart: on-failure

volumes:
  bun-cache:
